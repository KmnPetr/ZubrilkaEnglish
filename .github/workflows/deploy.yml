name: Deploy
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Set up Java
        uses: actions/setup-java@v2
        with:
          distribution: adopt
          java-version: 17

      - name: Checkout
        uses: actions/checkout@v2

      - name: Mvn Clean Package
        run: mvn -f ./ZubrilkaEnglish_server clean package

      - name: Login to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Build
        run: docker build -t kmnpetr/ze ./ZubrilkaEnglish_server

      - name: Docker Push
        run: docker push kmnpetr/ze

      - name: Stop APP on server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            docker ps -a || true
            docker compose -f /home/ze/docker-compose.yml down || true
            docker images || true
            docker rmi kmnpetr/ze || true
            mkdir /home/ze/ || true


      - name: Checkout
        uses: actions/checkout@v2
      - name: Send docker-compose.yml to server
        uses: kostya-ten/ssh-server-deploy@v4
        with:
          host: ${{ secrets.SERVER_IP }}
          port: 22
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          scp_source: ./ZubrilkaEnglish_server/docker-compose.yml
          scp_target: /home/ze
          before_script: |
            echo "Start Deploy"
          after_script: |
            echo "And Deploy"

      - name: Up docker-compose.yml
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            docker compose -f /home/ze/docker-compose.yml up -d