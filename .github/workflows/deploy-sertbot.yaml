#задеплоит на сервер бэк часть простым способом через docker-compose
name: Deploy_SertBot
#on: workflow_dispatch

on:
  push:
    branches:
      - main

#env:
#  DOMAIN_NAME: 608686.cloud4box.ru
#  BD_PASSWORD: ${{secrets.BD_PASSWORD}}
#  BD_USER: ${{secrets.BD_USER}}
#  JWT_SECRET: ${{secrets.JWT_SECRET}}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v2


      - name: Make Directory
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            mkdir -p /sertbot
            mkdir -p /sertbot/lib
            mkdir -p /sertbot/log
            

      - name: Docker Compose Down
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            docker compose -f /sertbot/docker-compose.yaml down || true

      - name: Copy files to remote server
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USERNAME: ${{ secrets.SERVER_USERNAME }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          sshpass -p "$SERVER_PASSWORD" scp -o StrictHostKeyChecking=no sertbot/docker-compose.yaml $SERVER_USERNAME@$SERVER_IP:/sertbot/docker-compose.yaml
          sshpass -p "$SERVER_PASSWORD" scp -o StrictHostKeyChecking=no sertbot/Dockerfile $SERVER_USERNAME@$SERVER_IP:/sertbot/Dockerfile
          sshpass -p "$SERVER_PASSWORD" scp -o StrictHostKeyChecking=no sertbot/script.sh $SERVER_USERNAME@$SERVER_IP:/sertbot/script.sh


      - name: Docker Compose Up
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
#          envs: DOMAIN_NAME
          script: |
            docker compose -f /sertbot/docker-compose.yaml up --build -d