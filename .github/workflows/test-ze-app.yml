          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            git -C /home/ZubrilkaEnglish-private- pull

      - name: Up docker-compose.yml
        uses: appleboy/ssh-action@master
