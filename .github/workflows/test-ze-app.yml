name: Test-App
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v2

      - name: Setup git config
        run: |
          git config user.name "GitHub Actions"
          git config user.email "<>"

      - name: Сhanging the application version
        run: |
          File="./ZubrilkaEnglish_server/pom.xml"
          
          sudo apt-get install -y xmlstarlet
          
          Version=$(xmlstarlet sel -N p=http://maven.apache.org/POM/4.0.0 -t -v "/p:project/p:version" $File)
          echo "Old version: ${Version}"
          IFS='.' read -r -a arr <<< "$Version"
          #если в следующей строке возникнет ошибка,возможно скрипт пытается прибавить 1 к нулю
          ((arr[2]+=1))
          NewVersion=$(IFS="."; echo "${arr[*]}")
          echo "NewVersion: ${NewVersion}"
          echo "NEW_VARIABLE=${NewVersion}" >> $GITHUB_ENV
          
          xmlstarlet ed -L -N p=http://maven.apache.org/POM/4.0.0 -u "/p:project/p:version" -v $NewVersion $File
          
          git add .
          git commit -m "[skip ci] Workwlow modification: App-version = $NewVersion"
          #для работы коммита требуется настроить name и email для гита(смотреть шаг Setup git config)
          #а также дать разрешение на запись через веб страницу github (репозиторий>>Settings>>Actions>>General>>Workflow permissions)
          git push origin main

      - name: Check Env
        run: |
          echo $NEW_VARIABLE
          echo $NEW_VARIABLE
          echo $NEW_VARIABLE
          echo $NEW_VARIABLE
          echo $NEW_VARIABLE
          
      - name: Set up Java
        uses: actions/setup-java@v2
        with:
          distribution: adopt
          java-version: 17


      - name: Mvn Clean Package
        run: mvn -f ./ZubrilkaEnglish_server clean package

      - name: Login to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Build And Push
        run: |
          Version=$(xmlstarlet sel -N p=http://maven.apache.org/POM/4.0.0 -t -v "/p:project/p:version" ./ZubrilkaEnglish_server/pom.xml)
          ImageName="ze-app:${Version}"

          docker build -t kmnpetr/$ImageName ./ZubrilkaEnglish_server
          docker tag kmnpetr/$ImageName kmnpetr/ze-app:latest
          docker push kmnpetr/ze-app:latest

