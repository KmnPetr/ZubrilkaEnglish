version: '3.8'

services:
  certbot:
    container_name: certbot
    build:
      context: .
      args:
        DOMAIN_NAME: ${DOMAIN_NAME}
        MY_EMAIL: ${MY_EMAIL}
#    certbot renew --dry-run   для перезаписи пробная симуляция
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot_keys:/etc/letsencrypt/${DOMAIN_NAME} #ключи сертификаты и прочие конфиги бота. скрипты по пути ......
#      - "/sertbot:/etc/letsencrypt" #ключи сертификаты и прочие конфиги бота. скрипты по пути ......
      - "/sertbot/lib:/var/lib/letsencrypt" # просто пустая наверное
      - "/sertbot/log:/var/log"

volumes:
  certbot_keys: