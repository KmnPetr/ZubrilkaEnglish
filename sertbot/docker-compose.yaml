version: '3.8'

services:
  certbot:
    image: certbot/certbot
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME}
    command: /bin/sh -c "chmod +x /sertbot/my-script/certbot_update.sh && /sertbot/my-script/certbot_update.sh"
    ports:
      - "80:80"
    volumes:
      - "/sertbot:/etc/letsencrypt" #ключи сертификаты и прочие конфиги бота. скрипты по пути ......
      - "/sertbot/lib:/var/lib/letsencrypt" # просто пустая наверное
      - "/sertbot/my-script:/sertbot/my-script" # Передача скрипта в контейнер
