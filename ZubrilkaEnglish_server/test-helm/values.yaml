annotations:
  test: ok
replicas: 1
image:
  repository: kmnpetr/ze-app
  #it is necessary to insert for deploy process
  tag: test
port: 28700
resources:
  requests:
    cpu: 250m
    memory: 400Mi
  limits:
    cpu: 350m
    memory: 500Mi
env:
  #it is necessary to insert from git secrets
  spring.datasource.url:
  spring.datasource.password:
  jwt_secret:
  spring.datasource.username: "postgres"
  spring.datasource.driver-class-name: "org.postgresql.Driver"
  spring.jpa.properties.hibernate.dialect: "org.hibernate.dialect.PostgreSQLDialect"
  spring.jpa.properties.hibernate.show_sql: "true"

serviceNodePort:
  port: 80
  targetPort: 28700
  nodePort: 30000
