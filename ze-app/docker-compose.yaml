version: '3.8'

services:
  zedbpostgres:
    image: postgres:14.3-alpine
    restart: always
    container_name: zedbpostgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=testPassword
      - POSTGRES_USER=postgres
    volumes:
      - zedbpostgres:/var/lib/postgresql/data/
    networks:
      - ze_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 10

  ze_app:
    container_name: ze_app
    image: kmnpetr/ze-app:1.1.9
    restart: always
    ports:
      - "28700:28700"
    environment:
      spring.r2dbc.url: "r2dbc:postgresql://zedbpostgres:5432/postgres"
      spring.r2dbc.password: "testPassword"
      spring.r2dbc.username: "postgres"
      jwt_secret: "testSecret"
    networks:
      - ze_network
    depends_on:
      zedbpostgres:
        condition: service_healthy

volumes:
  zedbpostgres:

networks:
  ze_network:
    driver: bridge