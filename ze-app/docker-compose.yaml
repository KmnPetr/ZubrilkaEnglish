version: '3.8'

services:
  ze-db-postgres:
    image: postgres:14.3-alpine
    restart: always
    container_name: ze-db-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=${BD_PASSWORD}
      - POSTGRES_USER=${BD_USER}
    volumes:
      - ze-db-postgres:/var/lib/postgresql/data/
    networks:
      - ze_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 10


  ze-app:
    container_name: ze-app
    image: kmnpetr/ze-app:${TAG_IMAGE}
    restart: always
    ports:
      - "8443:8443"
    environment:
      spring.r2dbc.url: "r2dbc:postgresql://ze-db-postgres:5432/${BD_USER}"
      spring.r2dbc.password: ${BD_PASSWORD}
      spring.r2dbc.username: ${BD_USER}
      jwt_secret: ${JWT_SECRET}
      spring.flyway.url: "jdbc:postgresql://ze-db-postgres:5432/${BD_USER}"
      spring.flyway.password: ${BD_PASSWORD}
      spring.flyway.user: ${BD_USER}
      CONTEXT_RELOAD_KEY: ${CONTEXT_RELOAD_KEY}
      LOKI: "http://loki:3100"
    networks:
      - ze_network
    volumes:
      - certbot_keys:/keys
    depends_on:
#      victoriametrics:
#        condition: service_healthy
#      loki:
#        condition: service_healthy
      ze-db-postgres:
        condition: service_healthy

  victoriametrics:
    container_name: victoriametrics
    image: victoriametrics/victoria-metrics:v1.93.12
    restart: always
    ports:
      - "8428:8428"
    entrypoint: /victoria-metrics-prod -promscrape.config=/promscrape.yaml
    networks:
      - ze_network
    volumes:
      - /victoriametrics/promscrape.yaml:/promscrape.yaml
      - victoriametrics:/victoria-metrics-data
#    healthcheck:
#      test: ["CMD-SHELL", "curl -f http://localhost:8428/health || exit 1"]
#      interval: 30s
#      timeout: 10s
#      retries: 5
#      start_period: 30s

  loki:
    container_name: loki
    image: grafana/loki:2.9.4
    ports:
      - "3100:3100"
    volumes:
      - loki:/loki
    networks:
      - ze_network
#    healthcheck:
#      test: ["CMD-SHELL", "wget --spider -q http://localhost:3100/ready || exit 1"]
#      interval: 30s
#      timeout: 10s
#      retries: 5
#      start_period: 30s

  tracing:
    container_name: tracing
    image: grafana/tempo:2.3.1
    command: ["--config.file=/etc/tempo.yaml"]
    ports:
      - "3200:3200" #собственный для rest api
      - "9095:9095" #для grps
      - "4317:4317" #для опен телеметрии grps
      - "4318:4318" #для http опен телеметрии
      - "9411:9411" #для формата zipkin
      - "14268:14268" #джагер
    volumes:
      - /metrics/tempo.yaml:/etc/tempo.yaml
      - tempo:/var/lib/tempo


  grafana:
    container_name: grafana
    image: grafana/grafana:10.2.4
    ports:
      - "3000:3000"
    volumes:
      - grafana:/var/lib/grafana/
    networks:
      - ze_network




volumes:
  ze-db-postgres:
  certbot_keys:
  grafana:
  victoriametrics:
  loki:
  tempo:

networks:
  ze_network:
    driver: bridge