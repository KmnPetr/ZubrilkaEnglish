<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Login page</title>
</head>
<body>

<form name="f" method="post" action="/process_login">
  <!--  подключили SCRF токен-->
  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

  <label for="username">Введите свой email: </label>
  <input type="text" name="username" id="username"/>
  <br/>
  <label for="password">Введите пароль: </label>
  <input type="password" name="password" id="password"/>
  <br/>
  <input type="submit" value="Login"/>

  <div th:if="${param.error}" style="color: red">Неправильные имя или пароль</div>
</form>

<br/>
<hr/>
<a href="/auth/registration">Registering a new user</a>

</body>
</html>
