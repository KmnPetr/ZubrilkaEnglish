server {
    listen 45777 ssl; # Слушаем порт 45777 по HTTPS

    ssl_certificate /etc/nginx/ssl/localhost.crt; # Путь к вашему сертификату
    ssl_certificate_key /etc/nginx/ssl/localhost.key; # Путь к ключу

    # Дополнительные SSL-настройки
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    location /testnginx {
        return 200 'Nginx OK!';
        add_header Content-Type text/plain;
    }

    location /api {
            proxy_pass https://localhost:8443;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_ssl_verify off;
    }

    location / {
        proxy_pass https://localhost:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_verify off;
    }
}