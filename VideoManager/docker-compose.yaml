version: '3.8'

services:
  vm-db-postgres:
    image: postgres:14.3-alpine
    restart: always
    container_name: vm-db-postgres
    ports:
      - "5432:5432"
    environment:
#      - POSTGRES_PASSWORD=${BD_PASSWORD}
#      - POSTGRES_USER=${BD_USER}
      - POSTGRES_PASSWORD=0987654321
      - POSTGRES_USER=postgres
    volumes:
      - vm-db-postgres:/var/lib/postgresql/data/
    networks:
      - vm_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 10


volumes:
  vm-db-postgres:

networks:
  vm_network:
    driver: bridge